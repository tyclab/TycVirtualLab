[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tycvirtuallab"
version = "0.1.0"
description = "Deterministic virtual firmware capture and comparison, with private experiments"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
tycvl = "vfl.cli:main"
tycvl-ghidra = "vfl.ghidra:main"

[tool.setuptools]
packages = ["vfl"]

[tool.setuptools.package-data]
vfl = ["web/*", "profiles/*.json", "ghidra/*.java"]
